## Workflow: R CMD check for xtweetsR
## Runs on every push and pull request to main.
## Installs R + dependencies, compiles the TypeScript sidecar,
## then runs R CMD check (tests, documentation, build).
##
## No live X/Twitter access is required — all tests use local fixtures
## and mock infrastructure.

name: R-CMD-check

on:
  push:
    branches: [main, PLAN]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: ubuntu-latest, r: "release" }

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: no

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Compile TypeScript sidecar
        working-directory: inst/node
        run: |
          npm ci
          npm run build

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}

      - name: Install R system dependencies
        if: runner.os == "Linux"
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev

      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: R CMD check
        uses: r-lib/actions/r-cmd-check@v2
        with:
          error-on: '"note"'
