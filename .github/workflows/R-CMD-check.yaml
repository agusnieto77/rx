## Workflow: R CMD check for xtweetsR
## Runs on every push and pull request to main.
## Compiles the TypeScript sidecar, then runs R CMD check (tests, documentation, build).
## No live X/Twitter access — all tests use local fixtures and mocks.

name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: no
      SKIP_PROTOCOL_TESTS: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Compile TypeScript sidecar
        working-directory: inst/node
        run: |
          npm ci
          npm run build

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"

      - name: Install R system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev

      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::rcmdcheck
          needs: check

      - name: R CMD check
        run: R CMD check . --no-manual --no-vignettes
