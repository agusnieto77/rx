## Workflow: R package checks for xtweetsR
## Phase 1: Smoke test — package loads, compiles, basic test
## Phase 2: Full build — R CMD build verifies package structure
## Phase 3: R CMD check — full check with test suite (warns, doesn't block)
## No live X/Twitter access — all tests use local fixtures and mocks.

name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Phase 1: Quick smoke
  smoke:
    runs-on: ubuntu-latest
    env:
      SKIP_PROTOCOL_TESTS: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Compile TypeScript sidecar
        working-directory: inst/node
        run: |
          npm ci
          npm run build

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"

      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::tibble
          needs: test

      - name: Run smoke test
        run: Rscript -e "testthat::test_file('tests/testthat/test-smoke.R', reporter = 'minimal')"

      - name: Verify package loads
        run: Rscript -e "pkgload::load_all(quiet=TRUE); cat('OK\n')"

  # Phase 2: Package build
  build:
    runs-on: ubuntu-latest
    needs: smoke
    env:
      SKIP_PROTOCOL_TESTS: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"

      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: R CMD build
        run: R CMD build .

  # Phase 3: Full R CMD check
  check:
    runs-on: ubuntu-latest
    needs: build
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: no
      SKIP_PROTOCOL_TESTS: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"

      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: R CMD check (notes-only)
        run: R CMD check . --no-manual --no-vignettes 2>&1 | tee check.log; exit 0
